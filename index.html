<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Earth Toy" />
    <meta name="theme-color" content="#0b1030" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" href="./icon-192.png" />
    <title>Earth Toy</title>
  </head>
  <body>
    <div id="app">
      <canvas id="globe"></canvas>

      <div id="loading">
        <div class="spinner">🌍</div>
        <div>Getting the world ready…</div>
      </div>

      <header id="title">Earth Toy</header>

      <div id="side-buttons">
        <button id="btn-zoom-in" class="round" aria-label="Zoom in">＋</button>
        <button id="btn-zoom-out" class="round" aria-label="Zoom out">－</button>
        <button id="btn-home" class="round" aria-label="Back to start">🏠</button>
        <button id="btn-sound" class="round" aria-label="Talking on or off">🔊</button>
        <button id="btn-play" class="round" aria-label="Play a game">🎮</button>
        <button id="btn-book" class="round" aria-label="Sticker book">📒<span id="book-count" class="badge">0</span></button>
      </div>

      <div id="labels" aria-hidden="true"></div>

      <div id="card" class="hidden" role="dialog" aria-live="polite">
        <div id="card-head">
          <div id="card-emoji"></div>
          <div id="card-titles">
            <div id="card-title"></div>
            <div id="card-sub"></div>
          </div>
          <button id="card-speak" class="round small" aria-label="Read it to me">🔊</button>
          <button id="card-close" class="round small" aria-label="Close">✕</button>
        </div>
        <div id="card-rows"></div>
        <button id="card-ride" class="ride-btn hidden">🎢 Ride along!</button>
      </div>

      <!-- games -->
      <div id="play-menu" class="modal hidden">
        <div class="sheet">
          <button class="round small close" data-close="play-menu" aria-label="Close">✕</button>
          <h2>Let's play!</h2>
          <div class="levels">
            <button class="pill level on" data-level="1">🐣 Easy</button>
            <button class="pill level" data-level="2">🦁 Harder</button>
          </div>
          <div class="tiles">
            <button id="start-hunt" class="tile"><span>🔍</span>Where in the World?</button>
            <button id="start-quiz" class="tile"><span>🧠</span>Globe Quiz</button>
            <button id="start-states" class="tile"><span>🇺🇸</span>Find all 50 States<small id="states-progress"></small></button>
          </div>
        </div>
      </div>

      <div id="hunt-bar" class="hidden">
        <div id="hunt-find"><small>Find</small><span id="hunt-emoji"></span><b id="hunt-name"></b></div>
        <div id="hunt-stars"></div>
        <button id="hunt-say" class="round small" aria-label="Say it again">🔊</button>
        <button id="hunt-quit" class="round small" aria-label="Stop playing">✕</button>
      </div>

      <div id="quiz" class="modal hidden">
        <div class="sheet">
          <button id="quiz-quit" class="round small close" aria-label="Stop playing">✕</button>
          <div id="quiz-dots"></div>
          <div id="quiz-emoji"></div>
          <div id="quiz-q"></div>
          <button id="quiz-say" class="round small" aria-label="Say it again">🔊</button>
          <div id="quiz-options"></div>
        </div>
      </div>

      <div id="result" class="modal hidden">
        <div class="sheet center">
          <div id="result-stars"></div>
          <h2 id="result-text"></h2>
          <div class="tiles two">
            <button id="result-again" class="tile small">🔁 Play again</button>
            <button id="result-done" class="tile small">🌍 Back to the globe</button>
          </div>
        </div>
      </div>

      <div id="book" class="modal hidden">
        <div class="sheet tall">
          <button class="round small close" data-close="book" aria-label="Close">✕</button>
          <h2>📒 My Sticker Book</h2>
          <div id="book-tabs"></div>
          <div id="book-count-line"></div>
          <div id="book-grid"></div>
          <button id="book-reset" class="reset">Hold to start over (for grown-ups)</button>
        </div>
      </div>

      <div id="toast" class="hidden"><span id="toast-emoji"></span><div><small id="toast-kind"></small><b id="toast-name"></b></div></div>

      <div id="ride-hud" class="hidden">
        <div id="ride-title"></div>
        <button id="ride-speed" class="pill">×1</button>
        <button id="ride-off" class="pill off-btn">Get off</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
