name: Record voice

# Records any read-aloud sentences that don't have a recording yet, then redeploys the site.
on:
  push:
    branches: [main]
    paths: ['src/data/**', 'src/voice/**', 'voice/config.json', 'scripts/record_voice.py', 'scripts/collect-sentences.ts']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: record-voice
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/collect-sentences.ts > voice/sentences.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-voice.txt
      - run: pip install -r scripts/requirements-voice.txt
      - uses: actions/cache@v4
        id: model
        with:
          path: |
            kokoro-v1.0.int8.onnx
            voices-v1.0.bin
          key: kokoro-v1.0-int8
      - if: steps.model.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          curl -sSL -o voices-v1.0.bin $base/voices-v1.0.bin
      - run: python scripts/record_voice.py --shard ${{ matrix.shard }} --shards 8 --out new-voice
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.shard }}
          path: new-voice
          if-no-files-found: ignore

  commit:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/collect-sentences.ts > voice/sentences.json
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          path: new-voice
          merge-multiple: true
      - name: Add recordings
        run: |
          mkdir -p public/voice
          if [ -d new-voice ] && [ -n "$(ls -A new-voice)" ]; then cp new-voice/*.mp3 public/voice/; fi
          node scripts/voice-index.mjs --prune
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/voice
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Record read-aloud voice ($(ls new-voice 2>/dev/null | wc -l) new clips)"
          git pull --rebase origin main
          git push origin main
          echo "PUSHED=1" >> $GITHUB_ENV
      - name: Redeploy the site
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
